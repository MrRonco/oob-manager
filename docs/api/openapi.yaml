# oob-manager read-only HTTP API (plan 06 §3.2). Hand-written; internal/repopolicy
# TestOpenAPICoversEveryRoute fails when a route registered in internal/api is missing
# here (or listed here but not registered). Every operation is GET (HEAD is accepted
# too); the API never changes state. Errors are RFC 9457 Problem Details.
openapi: 3.0.3
info:
  title: oob-manager API
  version: "1"
  description: |
    Read-only access to the fleet a running oob-manager polls. Authenticate with a
    read-only API token (Settings, API tokens) as `Authorization: Bearer <token>`.
    Each token is limited to 60 requests per minute (CSV exports 6 per minute); over
    the limit the answer is 429 with Retry-After.
servers:
  - url: https://192.0.2.45:8443
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    ServerID:
      name: id
      in: path
      required: true
      description: A server id as configured (lowercase letters, digits and dashes).
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,31}$", example: r240 }
    Sensor:
      name: sensor
      in: query
      required: true
      description: A sensor key from /history/sensors.
      schema: { type: string, example: "temp:0" }
    Range:
      name: range
      in: query
      description: A preset range (24h, 7d, 30d, 1y). Not together with from/to/step.
      schema: { type: string, example: 24h }
    From:
      name: from
      in: query
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      schema: { type: string, format: date-time }
    Step:
      name: step
      in: query
      description: Bucket size in seconds.
      schema: { type: integer, minimum: 1 }
  responses:
    Problem:
      description: RFC 9457 Problem Details (400, 401, 403, 404, 429).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    CSV:
      description: RFC 4180 CSV with a header row; cells that could start a spreadsheet formula are guarded.
      content:
        text/csv:
          schema: { type: string }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    Object:
      type: object
      additionalProperties: true
paths:
  /healthz:
    get:
      summary: Process is alive.
      security: []
      responses:
        "200": { description: '{"status":"ok"}', content: { application/json: { schema: { $ref: "#/components/schemas/Object" } } } }
  /readyz:
    get:
      summary: Ready (database answers, at least one BMC polled); ok, degraded or unavailable.
      security: []
      responses:
        "200": { description: ok or degraded, content: { application/json: { schema: { $ref: "#/components/schemas/Object" } } } }
        "503": { description: unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/Object" } } } }
  /metrics:
    get:
      summary: Prometheus text format (off unless metrics.enabled; then a read-only token is required).
      responses:
        "200": { description: metrics, content: { text/plain: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/version:
    get:
      summary: Version, commit, Go version and dependency hash.
      responses:
        "200": { description: version, content: { application/json: { schema: { $ref: "#/components/schemas/Object" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/servers:
    get:
      summary: Every server with health, power state and poll freshness.
      responses:
        "200": { description: "{data:[...], meta:{total}}", content: { application/json: { schema: { $ref: "#/components/schemas/Object" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}:
    get:
      summary: One server's latest snapshot (temperatures, fans, PSUs, power, voltages, health).
      parameters: [{ $ref: "#/components/parameters/ServerID" }]
      responses:
        "200": { description: snapshot, content: { application/json: { schema: { $ref: "#/components/schemas/Object" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/events:
    get:
      summary: BMC event log entries, newest first, paginated.
      parameters:
        - { $ref: "#/components/parameters/ServerID" }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: events, content: { application/json: { schema: { $ref: "#/components/schemas/Object" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/firmware:
    get:
      summary: One server's firmware inventory with flags and catalog updates.
      parameters: [{ $ref: "#/components/parameters/ServerID" }]
      responses:
        "200": { description: firmware, content: { application/json: { schema: { $ref: "#/components/schemas/Object" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/firmware:
    get:
      summary: Fleet firmware inventory, filterable.
      parameters: &fwfilter
        - { name: server, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: flagged, in: query, schema: { type: string, enum: ["0", "1"] } }
        - { name: updates, in: query, schema: { type: string, enum: ["0", "1"] } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200": { description: firmware rows, content: { application/json: { schema: { $ref: "#/components/schemas/Object" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/firmware.csv:
    get:
      summary: The same rows as CSV (needs the export permission).
      parameters: *fwfilter
      responses:
        "200": { $ref: "#/components/responses/CSV" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/firmware/catalog:
    get:
      summary: Vendor catalog state (enabled, last checks, imported version).
      responses:
        "200": { description: catalog, content: { application/json: { schema: { $ref: "#/components/schemas/Object" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/history/sensors:
    get:
      summary: The sampled sensors of a server.
      parameters: [{ $ref: "#/components/parameters/ServerID" }]
      responses:
        "200": { description: sensors, content: { application/json: { schema: { $ref: "#/components/schemas/Object" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/history:
    get:
      summary: One sensor's series (at most 2000 points).
      parameters:
        - { $ref: "#/components/parameters/ServerID" }
        - { $ref: "#/components/parameters/Sensor" }
        - { $ref: "#/components/parameters/Range" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/Step" }
      responses:
        "200": { description: series, content: { application/json: { schema: { $ref: "#/components/schemas/Object" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/history.csv:
    get:
      summary: One sensor's history as CSV (raw=1 for every sample; all=1 for every sensor, operator tokens only).
      parameters:
        - { $ref: "#/components/parameters/ServerID" }
        - { name: sensor, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Range" }
        - { name: raw, in: query, schema: { type: string, enum: ["1"] } }
        - { name: all, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200": { $ref: "#/components/responses/CSV" }
        default: { $ref: "#/components/responses/Problem" }
