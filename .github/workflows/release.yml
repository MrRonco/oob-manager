# oob-manager release (plan 06 §3.3): multi-arch image, binaries, SBOM, keyless cosign
# signature, SLSA provenance, GitHub release. Same supply-chain rules as ci.yml: actions
# pinned to a full commit SHA with the tag in the comment, read-only token by default,
# write scopes only on the job that publishes.
#
# DRY RUN BY DEFAULT. Until the repository is public, RELEASE_LIVE below stays "false":
# a manual run (Actions > release > Run workflow) builds the linux/amd64 + linux/arm64
# image (OCI archive with provenance and SBOM attestations), the binaries, checksums
# and the SPDX SBOM, and uploads them as workflow artifacts. It pushes nothing and signs
# nothing: a keyless signature writes the repository name and tag to Sigstore's public
# Rekor log, which would reveal the private repository. A pushed v* tag is ignored
# (one short gate job, everything else skipped).
#
# GOING LIVE is this one line: set RELEASE_LIVE to "true" (deploy/README "Verifying a
# release"). Then a pushed v* tag publishes to ghcr.io/<owner>/oob-manager, signs and
# attests it and creates the GitHub release; a manual run with dry_run unchecked does
# the same for the tag it is run on.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version label, e.g. v0.12.0 (a live manual run must be started on that tag)
        required: true
        type: string
      dry_run:
        description: Build and verify only; push and sign nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_LIVE: "true" # THE switch: live since the repository went public (2026-11-07)
  # renovate: datasource=github-releases depName=anchore/syft
  SYFT_VERSION: v1.54.0
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: v3.1.3
  GOTOOLCHAIN: local

jobs:
  # Decides version and mode, and refuses a live release whose commit has no green ci.yml run.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # list ci.yml runs for this commit
    outputs:
      version: ${{ steps.mode.outputs.version }}
      live: ${{ steps.mode.outputs.live }}
      run: ${{ steps.mode.outputs.run }}
    steps:
      - name: Mode and version
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY: ${{ inputs.dry_run }}
        run: |
          live=false
          if [ "$EVENT" = push ]; then
            version=$REF_NAME
            if [ "$RELEASE_LIVE" != true ]; then
              echo "RELEASE_LIVE is not true: tag $version ignored (dry-run mode until the repository is public)."
              { echo "version=$version"; echo "live=false"; echo "run=false"; } >>"$GITHUB_OUTPUT"
              exit 0
            fi
            live=true
          else
            version=$INPUT_VERSION
            if [ "$RELEASE_LIVE" = true ] && [ "$INPUT_DRY" = false ]; then
              live=true
              if [ "$REF_TYPE" != tag ] || [ "$REF_NAME" != "$version" ]; then
                echo "a live manual release must be started on the tag $version (it was started on $REF_TYPE $REF_NAME)"; exit 1
              fi
            fi
          fi
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "version $version is not vMAJOR.MINOR.PATCH[-pre]"; exit 1
          fi
          { echo "version=$version"; echo "live=$live"; echo "run=true"; } >>"$GITHUB_OUTPUT"
          echo "release $version, live=$live" >>"$GITHUB_STEP_SUMMARY"
      - name: The commit passed ci.yml
        if: steps.mode.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          LIVE: ${{ steps.mode.outputs.live }}
        run: |
          n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success" --jq .total_count)
          if [ "$n" -gt 0 ]; then echo "ci.yml passed on $SHA"; exit 0; fi
          if [ "$LIVE" = true ]; then echo "no successful ci.yml run for $SHA: refusing to publish"; exit 1; fi
          echo "::warning::no successful ci.yml run for $SHA (allowed in a dry run)"

  # Builds everything once with a read-only token; the artifacts are what a live run publishes.
  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # the emulated arm64 Go build is the long part
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Binaries and checksums (linux amd64, arm64)
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            out="build/$arch"; mkdir -p "$out"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -buildvcs=false \
              -ldflags="-s -w -X main.version=$VERSION" -o "$out/oob-manager" ./cmd/oob-manager
            tar -C "$out" -czf "dist/oob-manager_${VERSION#v}_linux_${arch}.tar.gz" oob-manager
          done
          (cd dist && sha256sum ./*.tar.gz >checksums.txt && cat checksums.txt)
      # The Dockerfile stays buildable by the legacy (non-BuildKit) builder, so the
      # arm64 image's Go stage runs under QEMU instead of cross-compiling via BUILDPLATFORM.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image (multi-arch OCI archive, provenance and SBOM attestations)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=dist/oob-manager-image.oci.tar
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ env.VERSION }}
      # The SBOM that is signed and attested on the image describes the image itself: Syft
      # reads the built OCI archive (its linux/amd64 image; arm64 holds the same packages
      # built for another architecture), not the source checkout.
      - name: SBOM of the image (Syft, SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_PLATFORM: linux/amd64
        with:
          image: oci-archive:dist/oob-manager-image.oci.tar
          syft-version: ${{ env.SYFT_VERSION }}
          format: spdx-json
          output-file: dist/oob-manager.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Summary
        run: |
          {
            echo "### oob-manager $VERSION (live=${{ needs.gate.outputs.live }})"
            echo '```'; ls -l dist; echo; cat dist/checksums.txt; echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ env.VERSION }}
          path: dist
          retention-days: 7
          if-no-files-found: error

  # LIVE ONLY: push, sign, attest, release. The only job with write scopes.
  publish:
    needs: [gate, build]
    if: needs.gate.outputs.live == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # the GitHub release
      packages: write # ghcr.io
      id-token: write # keyless cosign and attestations (Fulcio OIDC)
      attestations: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.VERSION }}
          path: dist
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the OCI archive (every platform and attestation, unchanged)
        id: push
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          command -v skopeo >/dev/null || { echo "skopeo is not on the runner image"; exit 1; }
          # The registry login is the one docker/login-action wrote; no token in argv.
          auth="$HOME/.docker/config.json"
          image="ghcr.io/${OWNER,,}/oob-manager"
          minor=$(echo "$VERSION" | sed -E 's/^(v[0-9]+\.[0-9]+)\..*/\1/')
          for tag in "$VERSION" "$minor"; do
            skopeo copy --all --dest-authfile "$auth" oci-archive:dist/oob-manager-image.oci.tar "docker://$image:$tag"
          done
          digest=$(skopeo inspect --raw --authfile "$auth" "docker://$image:$VERSION" | sha256sum | cut -d' ' -f1)
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "digest=sha256:$digest" >>"$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Keyless signature and SBOM attestation
        env:
          REF: ${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate dist/oob-manager.spdx.json "$REF"
      - name: Provenance for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Provenance for the binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: GitHub release (notes from the annotated tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -l --format='%(contents)' "$VERSION" >notes.md
          gh release create "$VERSION" --title "oob-manager $VERSION" --notes-file notes.md \
            dist/*.tar.gz dist/checksums.txt dist/oob-manager.spdx.json

  # LIVE ONLY: the commands users run (deploy/README "Verifying a release"), from a clean job.
  verify:
    needs: [gate, publish]
    if: needs.gate.outputs.live == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      IMAGE: ${{ needs.publish.outputs.image }}
      PUBLISHED: ${{ needs.publish.outputs.digest }}
      REPO: ${{ github.repository }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      # The commands below are docs/verify.md's, character for character (internal/repopolicy
      # TestVerifyDocMatchesReleaseWorkflow), so the release proves what users will run.
      - name: The steps of docs/verify.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '/^Digest:/ {print $2}')
          [ "$DIGEST" = "$PUBLISHED" ] || { echo "tag $VERSION resolves to $DIGEST, published $PUBLISHED"; exit 1; }
          REF="$IMAGE@$DIGEST"
          cosign verify "$REF" \
            --certificate-identity "https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify "oci://$REF" --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/release.yml"
          gh attestation verify "oci://$REF" --repo "$REPO" --format json \
            | jq -r '.[0].verificationResult.statement.predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit'
          cosign verify-attestation "$REF" --type spdxjson \
            --certificate-identity "https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            | jq -r '.payload' | base64 -d | jq '.predicate.packages | length'
          gh release download "$VERSION" --repo "$REPO" --dir "oob-$VERSION"
          cd "oob-$VERSION"
          sha256sum -c checksums.txt
          for f in oob-manager_*_linux_*.tar.gz; do
            gh attestation verify "$f" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/release.yml"
          done
